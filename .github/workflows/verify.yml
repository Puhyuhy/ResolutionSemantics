name: Verify paper package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean 4.33.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify proof package
        run: bash scripts/verify.sh
      - name: Preserve axiom audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axiom-audit
          path: build/axiom-audit.txt
          if-no-files-found: warn

  paper:
    name: Rebuild manuscript PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            lmodern poppler-utils
      - name: Build promoted manuscript PDF
        run: bash scripts/build-paper.sh
      - name: Promote exact generated PDF to PR head
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/relative-pattern-orbit-compression'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
          cp build/paper/Resolution_Semantics_Adrian_Puha.pdf paper/Resolution_Semantics_Adrian_Puha.pdf
          if git diff --quiet -- paper/Resolution_Semantics_Adrian_Puha.pdf; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paper/Resolution_Semantics_Adrian_Puha.pdf
          git commit -m "Update promoted manuscript PDF"
          git push origin HEAD:"$GITHUB_HEAD_REF"
      - name: Build restructured preview
        run: bash scripts/build-restructured-paper.sh
      - name: Preserve rebuilt PDF
        uses: actions/upload-artifact@v7
        with:
          name: resolution-semantics-paper
          path: build/paper/Resolution_Semantics_Adrian_Puha.pdf
      - name: Preserve restructured preview
        uses: actions/upload-artifact@v7
        with:
          name: resolution-semantics-restructured-preview
          path: build/paper/Resolution_Semantics_Restructured_Preview.pdf
