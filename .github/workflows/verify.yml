name: Verify paper package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-pdf:
    name: Promote verified manuscript PDF
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/relative-pattern-orbit-compression'
    steps:
      - uses: actions/checkout@v7
      - name: Download verified PDF artifact
        uses: actions/download-artifact@v7
        with:
          name: resolution-semantics-paper
          path: build/paper
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32084391624
      - name: Commit verified PDF to PR head
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
          cp build/paper/Resolution_Semantics_Adrian_Puha.pdf paper/Resolution_Semantics_Adrian_Puha.pdf
          if git diff --quiet -- paper/Resolution_Semantics_Adrian_Puha.pdf; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paper/Resolution_Semantics_Adrian_Puha.pdf
          git commit -m "Update promoted manuscript PDF"
          git push origin HEAD:"$GITHUB_HEAD_REF"
