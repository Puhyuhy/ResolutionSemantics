name: Verify paper package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean 4.33.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify proof package
        run: bash scripts/verify.sh
      - name: Preserve axiom audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axiom-audit
          path: build/axiom-audit.txt
          if-no-files-found: warn

  paper:
    name: Rebuild manuscript PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Install manuscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            lmodern poppler-utils
      - name: Refresh committed PDF on branch pushes
        if: github.event_name == 'push' && github.ref_name == 'agent/relative-pattern-orbit-compression'
        run: |
          bash scripts/build-paper.sh --update-committed
          if ! git diff --quiet -- paper/Resolution_Semantics_Adrian_Puha.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/Resolution_Semantics_Adrian_Puha.pdf
            git commit -m "Refresh deterministic manuscript PDF"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Build and inspect committed PDF
        if: github.event_name != 'push' || github.ref_name != 'agent/relative-pattern-orbit-compression'
        run: bash scripts/build-paper.sh --check-committed
      - name: Preserve rebuilt PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resolution-semantics-paper
          path: build/paper/Resolution_Semantics_Adrian_Puha.pdf
          if-no-files-found: warn
